# image: docker:24.0.5
stages:
  - test
  - build_deploy
  - deploy

variables:
    TZ: "Asia/Tehran"
    GIT_SSL_NO_VERIFY: "true" 
    VIRTUAL_ENV: "/usr/src/app/venv"
    PATH: "/usr/src/app/venv/bin:/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games"
    BUILD_DEPLOY_MASTER: "False"
    DIR: "/opt"

# test ##############################
.pre_test:
  image: python:3.8-slim-buster 
  before_script:    
    - source /usr/src/app/venv/bin/activate
    - cp /usr/src/app/.env.json .
    - cp /usr/src/app/.env.prod .
  script:
    - export https_proxy='http://172.30.112.9:6060' && export http_proxy='http://172.30.112.9:6060' #set proxy
    - python -m pip install --upgrade pip
    - python -m pip install -r base/requirements.txt
    - unset https_proxy && unset http_proxy

unit-tests:
  stage: test
  extends: .pre_test
  script:
    - python3 manage.py test

